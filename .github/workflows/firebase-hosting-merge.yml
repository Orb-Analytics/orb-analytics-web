name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: orb-analytics-7d212
          # Pinned: firebase-tools 15.34.1 added a pre-deploy check
          # (serviceusage.services.get) that this service account isn't allowed
          # to make, so every deploy since Oct 22 failed with a 403. 15.34.0 was
          # the last version that deployed. Unpin once the service account has
          # the "Service Usage Consumer" role.
          firebaseToolsVersion: "15.34.0"
