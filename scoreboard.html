<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scoreboard · Orb Analytics</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css?v=20260813d" />
  <style>
    .scoreboard-header {
      padding: 1.75rem 0 1.75rem;
      margin-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .scoreboard-header-inner {
      position: relative;
      padding-left: 1rem;
    }
    .scoreboard-header-inner::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.15rem;
      bottom: 0.15rem;
      width: 3px;
      border-radius: var(--radius-pill);
      background: var(--purple-600);
    }
    .scoreboard-header-inner .section-label {
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .scoreboard-header-inner .section-title {
      font-weight: 900;
    }
    @media (min-width: 769px) {
      .scoreboard-header-inner .section-title { font-size: clamp(2rem, 4vw, 3rem); }
    }
    .date-display {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gray-600);
      margin-top: 0.3rem;
    }

    /* ── Tabs ──────────────────────────────────────────────────── */
    .league-tabs {
      display: flex;
      gap: 0.35rem;
      flex-wrap: nowrap;
      overflow-x: auto;
      margin-bottom: 1rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .league-tabs::-webkit-scrollbar { display: none; }
    .league-tab {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 1.1rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--muted);
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: var(--transition); font-family: var(--font-body);
    }
    .league-tab.active { background: var(--purple-600); border-color: var(--purple-600); color: white; }
    .league-tab:hover:not(.active) { border-color: var(--hover-border); color: var(--text); background: var(--hover-tint); }
    body.dark .league-tab:not(.active) { color: var(--text); }
    .tab-live-count {
      background: var(--red); color: white;
      font-size: 0.75rem; font-weight: 700;
      padding: 0.1rem 0.4rem; border-radius: var(--radius-pill); line-height: 1.4;
    }

    /* ── Section dividers ──────────────────────────────────────── */
    .section-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0 0.65rem; }
    .sdl { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
    .sdl.live { color: var(--red); display: flex; align-items: center; gap: 0.35rem; }
    .sdl.final { color: var(--gray-600); }
    .sdl.pick { color: var(--purple-400); display: flex; align-items: center; gap: 0.35rem; }
    .sdl-line { flex: 1; height: 1px; background: var(--border); }

    /* ── Golf leaderboard rows ─────────────────────────────────── */
    .leaderboard-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.2rem 0; }
    .leaderboard-rank { font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600); flex-shrink: 0; min-width: 1.5rem; }
    .leaderboard-name { font-size: 0.8125rem; font-weight: 600; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .leaderboard-score { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 700; flex-shrink: 0; }
    .tournament-name { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; }

    /* ── Games grid ────────────────────────────────────────────── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding-bottom: 1rem;
    }
    @media (max-width: 900px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 580px) { .games-grid { grid-template-columns: 1fr; } }

    @media (max-width: 580px) {
      .scoreboard-header { padding: 1rem 0 0.75rem; flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .league-tab { padding: 0.4rem 0.85rem; font-size: 0.875rem; }
      .team-logo { width: 30px; height: 30px; }
      .team-logo-fallback { width: 30px; height: 30px; }
      .team-abbr { font-size: 1rem; }
      .team-score { font-size: 1.75rem; }
      .pitcher-name { font-size: 0.8125rem; }
      .card-venue { font-size: 0.75rem; }
      .vs-at { font-size: 1rem; }
    }

    /* ── Game card ─────────────────────────────────────────────── */
    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: 0.7rem;
      transition: border-color var(--transition), box-shadow var(--transition);
      position: relative; overflow: hidden;
    }
    .game-card:hover { border-color: var(--hover-border); box-shadow: var(--glow); }
    .game-card.live { border-color: rgba(239,68,68,0.3); }
    .game-card.live::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--red), rgba(239,68,68,0.2));
    }

    /* Card header */
    .card-header { display: flex; align-items: center; justify-content: space-between; }
    .card-league { font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600); letter-spacing: 0.08em; text-transform: uppercase; }
    .card-status { font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600); }
    .card-status.live-text { color: #FCA5A5; display: flex; align-items: center; gap: 0.3rem; }

    /* Side-by-side teams */
    .teams-block { display: flex; align-items: stretch; gap: 0; }

    .team-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.3rem; padding: 0.4rem 0.25rem;
      text-align: center;
    }

    .team-logo {
      width: 38px; height: 38px; object-fit: contain; flex-shrink: 0;
    }
    .team-logo-fallback {
      width: 38px; height: 38px; border-radius: var(--radius);
      background: var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: var(--gray-600);
    }

    .team-abbr {
      font-family: var(--font-display); font-size: 1rem; font-weight: 800;
      white-space: nowrap;
    }
    .team-abbr.winning { color: var(--text); }
    .team-abbr.losing  { color: var(--gray-600); }
    .team-abbr.bold    { font-weight: 900; }

    .team-record { font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600); }

    .team-score {
      font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; line-height: 1;
    }
    .team-score.winning { color: var(--text); }
    .team-score.losing  { color: var(--gray-600); }
    .team-score.bold   { font-weight: 900; }

    /* VS column */
    .vs-col {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.15rem; flex-shrink: 0; padding: 0 0.4rem;
    }
    .vs-at { font-family: var(--font-display); font-size: 1rem; color: var(--gray-600); font-weight: 400; }

    .team-odds {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-pill);
      background: var(--gray-100);
      border: 1px solid var(--border);
      color: var(--gray-600);
      white-space: nowrap;
    }

    .team-odds.pick {
      background: var(--purple-600);
      border-color: var(--purple-600);
      color: white;
    }

    /* Mini live situation (bases + count + outs) */
    .mini-situation {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      background: var(--gray-50); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.5rem 0.9rem;
    }
    .mini-bases { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
    .mini-base {
      position: absolute; width: 11px; height: 11px; background: var(--gray-200);
      border: 1.5px solid var(--border); transform: rotate(45deg); border-radius: 2px;
    }
    .mini-base.occupied { background: var(--purple-600); border-color: var(--purple-600); }
    .mini-base-2 { top: 0; left: 10.5px; }
    .mini-base-3 { top: 10.5px; left: 0; }
    .mini-base-1 { top: 10.5px; left: 21px; }
    .mini-stat { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; font-family: var(--font-mono); }
    .mini-stat-label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-600); }
    .mini-stat-value { font-size: 0.8125rem; font-weight: 700; color: var(--text); }
    .mini-outs-row { display: flex; align-items: center; gap: 0.3rem; }
    .mini-out-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray-200); border: 1px solid var(--border); }
    .mini-out-dot.filled { background: #FCA5A5; border-color: #FCA5A5; }

    .pitcher-matchup {
      background: var(--gray-50); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.55rem 0.75rem;
      display: flex; flex-direction: column; gap: 0.3rem;
    }
    .pitcher-matchup-label {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.1rem;
    }
    .pitcher-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .pitcher-team { font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600); flex-shrink: 0; min-width: 2rem; }
    .pitcher-name { font-size: 0.8125rem; font-weight: 600; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pitcher-era  { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }

    /* Card footer */
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 0.35rem; border-top: 1px solid var(--border); margin-top: auto; }
    .card-venue { font-size: 0.75rem; color: var(--gray-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .card-time  { font-family: var(--font-mono); font-size: 0.75rem; color: var(--gray-600); flex-shrink: 0; }

    /* Refresh */
    .refresh-btn {
      display: flex; align-items: center; gap: 0.4rem;
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--gray-600); font-size: 0.75rem; font-family: var(--font-body);
      padding: 0.4rem 0.8rem; cursor: pointer; transition: var(--transition);
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--hover-border); background: var(--hover-tint); }
    .refresh-btn svg { width: 13px; height: 13px; fill: currentColor; }
    .refresh-btn.spinning svg { animation: spin 0.75s linear infinite; }
  </style>
</head>
<body>

  <script src="js/nav.js?v=20260813"></script>
  <script>
    buildNav('scoreboard.html');

    const LEAGUES = [
      { id:'mlb', label:'MLB', logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png',     sport:'baseball',   slug:'mlb',  type:'team' },
      { id:'nfl', label:'NFL', logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',     sport:'football',   slug:'nfl',  type:'team' },
      { id:'nba', label:'NBA', logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',     sport:'basketball', slug:'nba',  type:'team' },
      { id:'nhl', label:'NHL', logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png',     sport:'hockey',     slug:'nhl',  type:'team' },
      { id:'atp', label:'ATP', logo:'https://a.espncdn.com/combiner/i?img=/redesign/assets/img/icons/ESPN-icon-tennis.png', sport:'tennis', slug:'atp', type:'tennis' },
      { id:'pga', label:'PGA', logo:'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/pgatour.png', sport:'golf', slug:'pga', type:'golf' },
    ];

    let activeLeague = 'mlb';
    const cache     = {};
    const eraCache  = {};

    let oddsMap = {}; // "AWAY|HOME" → { awayLine, homeLine, pick }
    // Map ESPN abbrs → model abbrs where they differ. ESPN now uses WSH/CHW directly
    // (matching the model), so only the Athletics OAK/ATH rename still needs this.
    const ESPN_TO_MODEL = {
      'ATH': 'OAK'
    };
    function toModelAbbr(abbr) {
      return ESPN_TO_MODEL[abbr] || abbr;
    }

    async function fetchOdds() {
      try {
        const res  = await fetch('https://raw.githubusercontent.com/Orb-Analytics/MLB-Model/main/predictions.json');
        const data = await res.json();
        const map  = {};
        for (const pick of data.picks || []) {
          if (!pick.has_pick) continue;
          const key = `${pick.away_team}|${pick.home_team}`;
          map[key] = {
            awayLine: pick.away_odds || null,
            homeLine: pick.home_odds || null,
            pick:     pick.pick,
            away:     pick.away_team,
            home:     pick.home_team
          };
        }
        oddsMap = map;
      } catch { oddsMap = {}; }
    }

    document.getElementById('date-display').textContent =
      new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    // ── Helpers ───────────────────────────────────────────────────
    const isLive  = s => s?.type?.name === 'STATUS_IN_PROGRESS';
    const isFinal = s => s?.type?.name === 'STATUS_FINAL';
    const isPre   = s => s?.type?.state === 'pre';
    const sortOrd = s => isLive(s) ? 0 : isPre(s) ? 1 : 2;

    function eraColor(era) {
      if (era === null || era === undefined) return 'var(--gray-500)';
      const v = parseFloat(era);
      return v < 3.50 ? 'var(--green)' : v > 4.50 ? '#FCA5A5' : 'var(--text)';
    }

    function logoHTML(abbr, league) {
      const url = `https://a.espncdn.com/i/teamlogos/${league}/500/${abbr.toLowerCase()}.png`;
      return `<img class="team-logo" src="${url}" alt="${abbr}"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
              <div class="team-logo-fallback" style="display:none">${abbr.slice(0,3).toUpperCase()}</div>`;
    }

    // ── Fetch ERA ─────────────────────────────────────────────────
    async function fetchERA(id) {
      if (!id) return null;
      if (eraCache[id] !== undefined) return eraCache[id];
      try {
        const r    = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}?hydrate=stats(group=pitching,type=season)`);
        const data = await r.json();
        const era  = data.people?.[0]?.stats?.[0]?.splits?.[0]?.stat?.era ?? null;
        eraCache[id] = era;
        return era;
      } catch { eraCache[id] = null; return null; }
    }

    // ── Fetch probable pitchers → map keyed by venue name ────────
    async function fetchPitchersTagged() {
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
      try {
        const r    = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today}&hydrate=team,probablePitcher,venue`);
        const data = await r.json();
        const map  = {}; // venueName → { away, home, awayAbbr, homeAbbr }
        for (const d of data.dates || []) {
          for (const g of d.games || []) {
            const venueName = g.venue?.name;
            if (venueName) {
              map[venueName] = {
                away: g.teams?.away?.probablePitcher || null,
                home: g.teams?.home?.probablePitcher || null,
                awayAbbr: g.teams?.away?.team?.abbreviation?.toUpperCase(),
                homeAbbr: g.teams?.home?.team?.abbreviation?.toUpperCase(),
              };
            }
          }
        }
        return map;
      } catch { return {}; }
    }

    // ── Build one game card ───────────────────────────────────────
    function buildCard(event, leagueId, pitcherMap) {
      const comp = event.competitions?.[0];
      if (!comp) return '';
      const home = comp.competitors?.find(c => c.homeAway === 'home');
      const away = comp.competitors?.find(c => c.homeAway === 'away');
      if (!home || !away) return '';

      const status = event.status;
      const live   = isLive(status);
      const final  = isFinal(status);
      const pre    = isPre(status);
      const showScore = live || final;

      const homeScore = parseInt(home.score ?? 0);
      const awayScore = parseInt(away.score ?? 0);
      const homeWin = homeScore > awayScore;
      const awayWin = awayScore > homeScore;

      // Broadcast network (top-left value)
      const broadcast = comp.broadcasts?.[0]?.names?.join('/') || comp.geoBroadcasts?.[0]?.media?.shortName || '';
      const gameDate  = event.date ? new Date(event.date).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';
      const gameTime  = event.date ? new Date(event.date).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true }) : '';

      // Status badge
      let statusHTML;
      if (live) {
        statusHTML = `<span class="badge badge-live"><span class="live-dot"></span>${status.type?.detail || 'Live'}</span>`;
      } else if (final) {
        statusHTML = `<span class="badge badge-final">Final</span>`;
      } else {
        statusHTML = `<span class="card-status">${gameTime}</span>`;
      }

      // Team column
      function teamCol(team, isWin, isLoss, side, oddsLine, isPick) {
        const abbr   = team.team?.abbreviation || '???';
        const record = team.records?.[0]?.summary || '';
        const score  = team.score ?? '';
        const abbrClass  = showScore ? (isWin ? 'winning' : isLoss ? 'losing' : '') : '';
        const scoreClass = live ? '' : isWin ? 'winning' : isLoss ? 'losing' : '';
        const abbrWeight = (final && isWin) ? '800' : (final && isLoss) ? '400' : '600';
        const scoreWeight = (final && isWin) ? '800' : (final && isLoss) ? '500' : '700';
        const fmtOdds = o => o > 0 ? `+${o}` : `${o}`;

        return `<div class="team-col">
          ${logoHTML(abbr, leagueId)}
          <div class="team-abbr ${abbrClass}" style="font-weight:${abbrWeight}">${abbr}</div>
          ${record ? `<div class="team-record">${record}</div>` : ''}
          ${oddsLine != null ? `<div class="team-odds${isPick ? ' pick' : ''}">${fmtOdds(Math.round(oddsLine))}${isPick ? (final && !isWin ? ' ✗' : ' ✓') : ''}</div>` : ''}
          ${showScore ? `<div class="team-score ${scoreClass}" style="font-weight:${scoreWeight}">${score}</div>` : ''}
        </div>`;
      }

      // Look up odds from predictions.json
      const awayAbbr = away.team?.abbreviation?.toUpperCase();
      const homeAbbr = home.team?.abbreviation?.toUpperCase();
      const oddsKey  = `${toModelAbbr(awayAbbr)}|${toModelAbbr(homeAbbr)}`;
      const gameOdds = leagueId === 'mlb' ? (oddsMap[oddsKey] || null) : null;

      // Live bases/outs (MLB only, in-progress games)
      let situationHTML = '';
      if (leagueId === 'mlb' && live && comp.situation) {
        const s    = comp.situation;
        const outs = s.outs ?? 0;
        situationHTML = `
          <div class="mini-situation">
            <div class="mini-bases">
              <div class="mini-base mini-base-2 ${s.onSecond ? 'occupied' : ''}"></div>
              <div class="mini-base mini-base-3 ${s.onThird ? 'occupied' : ''}"></div>
              <div class="mini-base mini-base-1 ${s.onFirst ? 'occupied' : ''}"></div>
            </div>
            <div class="mini-stat">
              <span class="mini-stat-label">Count</span>
              <span class="mini-stat-value">${s.balls ?? 0}-${s.strikes ?? 0}</span>
            </div>
            <div class="mini-stat">
              <span class="mini-stat-label">Outs</span>
              <div class="mini-outs-row">${[0,1,2].map(i => `<span class="mini-out-dot ${i < outs ? 'filled' : ''}"></span>`).join('')}</div>
            </div>
          </div>`;
      }

      // Pitcher matchup (MLB only) — keyed by venue name
      let pitcherHTML = '';
      if (leagueId === 'mlb') {
        const venueName = comp.venue?.fullName;
        const pitchers  = pitcherMap[venueName];
        if (pitchers && (pitchers.away || pitchers.home)) {
          const awayEra = pitchers.away ? eraCache[pitchers.away.id] : null;
          const homeEra = pitchers.home ? eraCache[pitchers.home.id] : null;
          pitcherHTML = `
            <div class="pitcher-matchup">
              <div class="pitcher-matchup-label">Pitching Matchup</div>
              ${pitchers.away ? `<div class="pitcher-row">
                <span class="pitcher-team">${pitchers.awayAbbr || away.team?.abbreviation}</span>
                <span class="pitcher-name">${pitchers.away.fullName}</span>
                <span class="pitcher-era" style="color:${eraColor(awayEra)}">ERA: ${awayEra != null ? parseFloat(awayEra).toFixed(2) : '—'}</span>
              </div>` : ''}
              ${pitchers.home ? `<div class="pitcher-row">
                <span class="pitcher-team">${pitchers.homeAbbr || home.team?.abbreviation}</span>
                <span class="pitcher-name">${pitchers.home.fullName}</span>
                <span class="pitcher-era" style="color:${eraColor(homeEra)}">ERA: ${homeEra != null ? parseFloat(homeEra).toFixed(2) : '—'}</span>
              </div>` : ''}
            </div>`;
        }
      }

      const venue    = comp.venue?.fullName || '';
      const leagueObj = LEAGUES.find(l => l.id === leagueId);
      const gameUrl  = `game.html?event=${event.id}&sport=${leagueObj.sport}&slug=${leagueObj.slug}&league=${leagueId}`;

      return `
        <div class="game-card ${live ? 'live' : ''}" onclick="location.href='${gameUrl}'" style="cursor:pointer">
          <div class="card-header">
            ${statusHTML}
            ${broadcast ? `<span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--purple-300);font-weight:700">${broadcast}</span>` : '<span></span>'}
          </div>
          <div class="teams-block">
            ${teamCol(away, awayWin, homeWin, 'away', gameOdds?.awayLine, gameOdds?.pick === awayAbbr)}
            <div class="vs-col">
              <span class="vs-at">@</span>
            </div>
            ${teamCol(home, homeWin, awayWin, 'home', gameOdds?.homeLine, gameOdds?.pick === homeAbbr)}
          </div>
          ${situationHTML}
          ${pitcherHTML}
          <div class="card-footer">
            <span class="card-venue">${venue}</span>
            <span class="card-time">${gameDate}${pre ? ` · ${gameTime}` : ''}</span>
          </div>
        </div>`;
    }

    // ── Live count badge (shared across all sport types) ─────────
    function updateLiveBadge(leagueId, liveCount) {
      const tab = document.querySelector(`[data-league="${leagueId}"]`);
      if (!tab) return;
      const existing = tab.querySelector('.tab-live-count');
      if (existing) existing.remove();
      if (liveCount > 0) {
        const badge = document.createElement('span');
        badge.className = 'tab-live-count';
        badge.textContent = liveCount;
        tab.appendChild(badge);
      }
    }

    // ── Render output ─────────────────────────────────────────────
    function renderOutput(events, leagueId, pitcherMap) {
      const output = document.getElementById('scoreboard-output');

      if (!events.length) {
        output.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <p>No ${leagueId.toUpperCase()} games scheduled today.</p>
        </div>`;
        return;
      }

      const sorted   = [...events].sort((a, b) => sortOrd(a.status) - sortOrd(b.status));

      // Pull out games we've made a prediction on (pinned to the top)
      function isPredicted(event) {
        if (leagueId !== 'mlb') return false; // odds map is only populated for MLB currently
        const comp = event.competitions?.[0];
        if (!comp) return false;
        const home = comp.competitors?.find(c => c.homeAway === 'home');
        const away = comp.competitors?.find(c => c.homeAway === 'away');
        if (!home || !away) return false;
        const key = `${toModelAbbr(away.team?.abbreviation?.toUpperCase())}|${toModelAbbr(home.team?.abbreviation?.toUpperCase())}`;
        return !!oddsMap[key];
      }
      const picks    = sorted.filter(isPredicted);
      const rest     = sorted.filter(e => !isPredicted(e));

      const live     = rest.filter(e => isLive(e.status));
      const upcoming = rest.filter(e => isPre(e.status));
      const finals   = rest.filter(e => isFinal(e.status));

      let html = '';

      if (picks.length) {
        html += `<div class="section-divider">
          <span class="sdl pick">Orb Model Picks</span>
          <div class="sdl-line"></div>
        </div>
        <div class="games-grid">${picks.map(e => buildCard(e, leagueId, pitcherMap)).join('')}</div>`;
      }

      if (live.length) {
        html += `<div class="section-divider" style="margin-top:${picks.length ? '1.5rem' : '1.25rem'}">
          <span class="sdl live"><span class="live-dot"></span>Live Now</span>
          <div class="sdl-line"></div>
        </div>
        <div class="games-grid">${live.map(e => buildCard(e, leagueId, pitcherMap)).join('')}</div>`;
      }

      if (upcoming.length) {
        const topMargin = live.length ? '1.5rem' : (picks.length ? '1.5rem' : '0');
        html += `<div class="games-grid" style="margin-top:${topMargin}">
          ${upcoming.map(e => buildCard(e, leagueId, pitcherMap)).join('')}
        </div>`;
      }

      if (finals.length) {
        html += `<div class="section-divider" style="margin-top:1rem">
          <span class="sdl final">Final</span>
          <div class="sdl-line"></div>
        </div>
        <div class="games-grid">${finals.map(e => buildCard(e, leagueId, pitcherMap)).join('')}</div>`;
      }

      output.innerHTML = html;

      // Update live count badge (all live games, including pinned picks)
      updateLiveBadge(leagueId, picks.filter(e => isLive(e.status)).length + live.length);
    }

    // ── Tennis (ATP) rendering ─────────────────────────────────────
    // Rolling window rather than strict calendar day so finished matches
    // don't vanish right at a local midnight boundary, and matches from
    // tournaments in other time zones still show up.
    function isWithinWindow(dateStr, ref, hours) {
      return Math.abs(ref - new Date(dateStr)) <= hours * 60 * 60 * 1000;
    }

    function flattenTennisMatches(events) {
      const matches = [];
      const seen = new Set();
      for (const ev of events) {
        for (const g of ev.groupings || []) {
          for (const c of g.competitions || []) {
            if (!c.id || seen.has(c.id)) continue;
            seen.add(c.id);
            matches.push({ tournament: ev.name, round: g.grouping?.displayName, comp: c });
          }
        }
      }
      return matches;
    }

    function buildTennisCard(m) {
      const c      = m.comp;
      const status = c.status?.type;
      const live   = status?.name === 'STATUS_IN_PROGRESS';
      const final  = status?.state === 'post';
      const away   = c.competitors?.find(x => x.homeAway === 'away');
      const home   = c.competitors?.find(x => x.homeAway === 'home');
      if (!away || !home) return '';

      const awayScores = (away.linescores || []).map(s => s.value != null ? Math.round(s.value) : null);
      const homeScores = (home.linescores || []).map(s => s.value != null ? Math.round(s.value) : null);
      const numSets    = Math.max(awayScores.length, homeScores.length, 1);

      const setHeaders = Array.from({length: numSets}, (_, i) =>
        `<th style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600);letter-spacing:0.08em;text-align:center;padding:0 0.75rem 0.5rem;font-weight:600">S${i+1}</th>`
      ).join('');

      function playerRow(p, myScores, oppScores, isLast) {
        const name = p.athlete?.shortName || p.athlete?.displayName || '';
        const flag = p.athlete?.flag?.href;
        const won  = final && p.winner;
        const lost = final && !p.winner;
        const seed = p.seed > 0 ? p.seed : null;
        const rank = p.rank;

        const setCells = Array.from({length: numSets}, (_, i) => {
          const my  = myScores[i];
          const opp = oppScores[i];
          const wonSet = my != null && opp != null && my > opp;
          return `<td style="text-align:center;padding:0.75rem 0.75rem;font-family:var(--font-mono);font-size:1.125rem;font-weight:${wonSet ? '800' : '500'};color:${wonSet ? 'var(--purple-600)' : 'var(--gray-400)'}">
            ${my != null ? my : '—'}
          </td>`;
        }).join('');

        return `<tr style="${isLast ? '' : 'border-bottom:1px solid var(--border)'}">
          <td style="padding:0.75rem 0">
            <div style="display:flex;align-items:center;gap:0.55rem">
              ${flag ? `<img src="${flag}" alt="" style="width:24px;height:16px;border-radius:2px;object-fit:cover;flex-shrink:0">` : ''}
              ${seed ? `<span style="font-family:var(--font-mono);font-size:0.75rem;font-weight:700;color:var(--purple-600);flex-shrink:0;background:var(--purple-100);border-radius:3px;padding:0.05rem 0.3rem">${seed}</span>` : ''}
              <span style="font-size:1rem;font-weight:${won ? '700' : seed ? '600' : '500'};color:${lost ? 'var(--gray-400)' : 'var(--text)'}">${name}</span>
              ${!seed && rank ? `<span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600);flex-shrink:0">#${rank}</span>` : ''}
            </div>
          </td>
          ${setCells}
        </tr>`;
      }

      let statusBadge;
      if (live)       statusBadge = `<span class="badge badge-live"><span class="live-dot"></span>${status?.detail || 'Live'}</span>`;
      else if (final) statusBadge = `<span class="badge badge-final">Final Score</span>`;
      else            statusBadge = `<span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600)">${new Date(c.date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}</span>`;

      const dateStr    = new Date(c.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const tennisBroadcast = c.broadcasts?.[0]?.names?.join('/') || c.geoBroadcasts?.[0]?.media?.shortName || '';
      const footerBits = [m.round, c.venue?.court].filter(Boolean).join(' · ');

      return `
        <div class="game-card ${live ? 'live' : ''}" style="padding:0;overflow:hidden">
          <div class="card-header" style="padding:0.85rem 1.1rem 0.7rem">
            ${statusBadge}
            ${tennisBroadcast
              ? `<span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--purple-300);font-weight:700">${tennisBroadcast}</span>`
              : `<span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600)">${dateStr}</span>`}
          </div>
          <div style="padding:0 1.1rem 0.85rem">
            <table style="width:100%;border-collapse:collapse">
              <thead><tr>
                <th style="width:100%"></th>
                ${setHeaders}
              </tr></thead>
              <tbody>
                ${playerRow(away, awayScores, homeScores, false)}
                ${playerRow(home, homeScores, awayScores, true)}
              </tbody>
            </table>
          </div>
          ${m.tournament ? `<div style="padding:0.55rem 1.1rem 0.75rem;border-top:1px solid var(--border)"><span style="font-size:0.75rem;color:var(--gray-600)">${m.tournament}</span></div>` : ''}
        </div>`;
    }

    function renderTennisOutput(events, leagueId) {
      const output = document.getElementById('scoreboard-output');
      const now     = new Date();

      function matchMinSeed(m) {
        const seeds = (m.comp.competitors || []).map(c => c.seed).filter(s => s > 0);
        return seeds.length ? Math.min(...seeds) : 999;
      }
      function isSeeded(m) {
        return (m.comp.competitors || []).some(c => c.seed > 0);
      }
      const seedSort = (a, b) => {
        const diff = matchMinSeed(a) - matchMinSeed(b);
        return diff !== 0 ? diff : new Date(a.comp.date) - new Date(b.comp.date);
      };

      const matches = flattenTennisMatches(events).filter(m => {
        const st = m.comp.status?.type;
        if (st?.name !== 'STATUS_IN_PROGRESS' && !isWithinWindow(m.comp.date, now, 20)) return false;
        const away = m.comp.competitors?.find(x => x.homeAway === 'away');
        const home = m.comp.competitors?.find(x => x.homeAway === 'home');
        if (!away || !home) return false;
        const awayName = away.athlete?.shortName || away.athlete?.displayName;
        const homeName = home.athlete?.shortName || home.athlete?.displayName;
        return !!(awayName && homeName);
      });

      if (!matches.length) {
        output.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <p>No ATP/WTA matches today.</p>
        </div>`;
        updateLiveBadge(leagueId, 0);
        return;
      }

      const live = matches.filter(m => m.comp.status?.type?.name === 'STATUS_IN_PROGRESS')
                          .sort(seedSort);
      const rest = matches.filter(m => m.comp.status?.type?.name !== 'STATUS_IN_PROGRESS');

      // Group by tournament, within each: seeded matches first (all shown), unseeded capped at 4
      const byTournament = new Map();
      for (const m of rest) {
        const key = m.tournament || 'Other';
        if (!byTournament.has(key)) byTournament.set(key, []);
        byTournament.get(key).push(m);
      }

      // Sort tournaments so those with the highest-seeded matchups (lowest min seed) appear first
      const sortedTournaments = [...byTournament.entries()].sort((a, b) => {
        const aMin = Math.min(...a[1].map(matchMinSeed));
        const bMin = Math.min(...b[1].map(matchMinSeed));
        return aMin - bMin;
      });

      let html = '';

      if (live.length) {
        html += `<div class="section-divider">
          <span class="sdl live"><span class="live-dot"></span>Live Now</span>
          <div class="sdl-line"></div>
        </div>
        <div class="games-grid">${live.map(buildTennisCard).join('')}</div>`;
      }

      for (const [tournament, tMatches] of sortedTournaments) {
        const seeded   = tMatches.filter(isSeeded).sort(seedSort);
        const unseeded = tMatches.filter(m => !isSeeded(m))
                                 .sort((a, b) => new Date(a.comp.date) - new Date(b.comp.date))
                                 .slice(0, 10);
        const toShow = [...seeded, ...unseeded];
        if (!toShow.length) continue;
        html += `<div class="section-divider" style="margin-top:1.5rem">
          <span class="sdl" style="color:var(--text);font-weight:600">${tournament}</span>
          <div class="sdl-line"></div>
        </div>
        <div class="games-grid">${toShow.map(buildTennisCard).join('')}</div>`;
      }

      output.innerHTML = html;
      updateLiveBadge(leagueId, live.length);
    }

    // ── Golf (PGA) rendering ───────────────────────────────────────
    function golfScoreStr(v) {
      if (v == null || isNaN(v)) return 'E';
      if (v === 0) return 'E';
      return v > 0 ? `+${v}` : `${v}`;
    }

    function buildGolfCard(ev) {
      const comp        = ev.competitions?.[0];
      if (!comp) return '';
      const status      = comp.status?.type || ev.status?.type;
      const live        = status?.state === 'in';
      const final       = status?.name === 'STATUS_FINAL';
      const allPlayers  = comp.competitors || [];
      const top         = allPlayers.slice(0, 10);
      const total       = allPlayers.length;

      let statusHTML;
      if (live)       statusHTML = `<span class="badge badge-live"><span class="live-dot"></span>${status?.detail || 'In Progress'}</span>`;
      else if (final) statusHTML = `<span class="badge badge-final">Final</span>`;
      else            statusHTML = `<span class="badge badge-final">${new Date(ev.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`;

      const thC  = `style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600);letter-spacing:0.07em;text-transform:uppercase;padding:0.5rem 1rem;text-align:center;font-weight:600;border-bottom:1px solid var(--border);background:var(--gray-50);white-space:nowrap"`;
      const thL  = `style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600);letter-spacing:0.07em;text-transform:uppercase;padding:0.5rem 1rem;text-align:left;font-weight:600;border-bottom:1px solid var(--border);background:var(--gray-50)"`;

      const currentPeriod = comp.status?.period;
      const rows = top.map((c, i) => {
        const pos        = c.order ?? (i + 1);
        const name       = c.athlete?.displayName || '???';
        const flag       = c.athlete?.flag?.href;
        const scoreNum   = parseFloat(c.score ?? 'E');
        const scoreColor = !isNaN(scoreNum) && scoreNum < 0 ? 'var(--green)' : !isNaN(scoreNum) && scoreNum > 0 ? '#FCA5A5' : 'var(--text)';
        const rounds     = (c.linescores || []).map(ls => ls.value != null ? ls.value : null);

        // ESPN's golf competitors carry no top-level "status" -- how far a
        // player is through their round has to be derived from how many
        // hole-by-hole linescores exist for the tournament's current round.
        const roundEntry  = (c.linescores || []).find(ls => ls.period === currentPeriod);
        const holesPlayed = roundEntry?.linescores?.length || 0;
        let thru;
        if (final)               thru = 'F';
        else if (!live)          thru = '—';
        else if (holesPlayed === 0)   thru = '-';
        else if (holesPlayed >= 18)   thru = 'F';
        else                     thru = String(holesPlayed);

        const roundCells = [0,1,2,3].map(r => {
          const v = rounds[r];
          return `<td style="font-family:var(--font-mono);font-size:0.75rem;color:${v == null ? 'var(--gray-400)' : 'var(--text)'};text-align:center;padding:0.5rem 1rem">${v != null ? v : '—'}</td>`;
        }).join('');

        return `<tr style="border-bottom:1px solid var(--border)">
          <td style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600);padding:0.55rem 1rem;text-align:center;width:3.5rem">${pos}</td>
          <td style="padding:0.55rem 1rem">
            <div style="display:flex;align-items:center;gap:0.6rem">
              ${flag ? `<img src="${flag}" alt="" style="width:20px;height:14px;border-radius:2px;object-fit:cover;flex-shrink:0">` : '<span style="width:20px;display:inline-block"></span>'}
              <span style="font-size:0.8125rem;font-weight:600;color:var(--text)">${name}</span>
            </div>
          </td>
          <td style="font-family:var(--font-mono);font-size:0.8125rem;font-weight:800;color:${scoreColor};text-align:center;padding:0.55rem 1rem;width:5rem">${golfScoreStr(scoreNum)}</td>
          ${roundCells}
          <td style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600);text-align:center;padding:0.55rem 1rem;width:4rem">${thru}</td>
        </tr>`;
      }).join('');

      const dateStr = new Date(ev.date).toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});

      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-family:var(--font-display);font-size:1.125rem;font-weight:700;color:var(--text);margin-bottom:0.2rem">${ev.name || ev.shortName || 'PGA Tour'}</div>
              <div style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600)">${dateStr}</div>
            </div>
            ${statusHTML}
          </div>
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse;min-width:480px">
              <thead><tr>
                <th ${thC} style="${thC.slice(7,-1)};width:3.5rem">POS</th>
                <th ${thL}>PLAYER</th>
                <th ${thC} style="${thC.slice(7,-1)};width:5rem">TOTAL</th>
                <th ${thC}>R1</th><th ${thC}>R2</th><th ${thC}>R3</th><th ${thC}>R4</th>
                <th ${thC} style="${thC.slice(7,-1)};width:4rem">THRU</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div style="padding:0.6rem 1rem;border-top:1px solid var(--border);text-align:center">
            <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gray-600)">Showing 10 of ${total} players</span>
          </div>
        </div>`;
    }

    function renderGolfOutput(events, leagueId) {
      const output = document.getElementById('scoreboard-output');
      if (!events.length) {
        output.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <p>No PGA tournament this week.</p>
        </div>`;
        updateLiveBadge(leagueId, 0);
        return;
      }
      const liveCount = events.filter(ev => (ev.competitions?.[0]?.status?.type || ev.status?.type)?.state === 'in').length;
      output.innerHTML = `<div style="display:flex;flex-direction:column;gap:1.25rem">${events.map(buildGolfCard).join('')}</div>`;
      updateLiveBadge(leagueId, liveCount);
    }

    // ── Load a league ─────────────────────────────────────────────
    async function loadLeague(leagueId, force = false) {
      const leagueObj = LEAGUES.find(l => l.id === leagueId);
      const output    = document.getElementById('scoreboard-output');

      output.innerHTML = `<div class="loading-state"><div class="spinner"></div> Loading ${leagueObj.label} games...</div>`;

      try {
        // Tennis: merge ATP + WTA so all major tournament draws are covered
        if (leagueObj.type === 'tennis') {
          const cacheKey = leagueId + '_combined';
          let events;
          if (!force && cache[cacheKey]) {
            events = cache[cacheKey];
          } else {
            const [atpData, wtaData] = await Promise.all([
              fetch('https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard').then(r => r.json()).catch(() => ({ events: [] })),
              fetch('https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard').then(r => r.json()).catch(() => ({ events: [] })),
            ]);
            events = [...(atpData.events || []), ...(wtaData.events || [])];
            cache[cacheKey] = events;
          }
          renderTennisOutput(events, leagueId);
          return;
        }

        let data;
        if (!force && cache[leagueId]) {
          data = cache[leagueId];
        } else {
          const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${leagueObj.sport}/${leagueObj.slug}/scoreboard`);
          data = await r.json();
          cache[leagueId] = data;
        }

        const events = data.events || [];

        if (leagueObj.type === 'golf')   { renderGolfOutput(events, leagueId); return; }

        let pitcherMap = {};

        if (leagueId === 'mlb') {
          [pitcherMap] = await Promise.all([
            fetchPitchersTagged(),
            fetchOdds(),
          ]);
          // Fetch all ERAs in parallel
          const allIds = [];
          Object.values(pitcherMap).forEach(p => {
            if (p.away?.id) allIds.push(p.away.id);
            if (p.home?.id) allIds.push(p.home.id);
          });
          await Promise.all([...new Set(allIds)].map(fetchERA));
        }

        renderOutput(events, leagueId, pitcherMap);

      } catch(err) {
        output.innerHTML = `<div class="empty-state">
          <p>Could not load ${leagueObj.label} scores.</p>
          <button class="btn btn-ghost btn-sm" onclick="loadLeague('${leagueId}',true)" style="margin-top:0.5rem">Try Again</button>
        </div>`;
      }
    }

    // ── Tabs ──────────────────────────────────────────────────────
    function buildTabs() {
      document.getElementById('league-tabs').innerHTML = LEAGUES.map(l => `
        <button class="league-tab ${l.id === activeLeague ? 'active' : ''}" data-league="${l.id}"
                onclick="switchLeague('${l.id}')">
          <img src="${l.logo}" height="18" style="border-radius:2px;flex-shrink:0"> ${l.label}
        </button>`).join('');
    }

    function switchLeague(id) {
      activeLeague = id;
      document.querySelectorAll('.league-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.league === id));
      loadLeague(id);
    }

    // ── Refresh ───────────────────────────────────────────────────
    async function doRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning'); btn.disabled = true;
      delete cache[activeLeague];
      delete cache[activeLeague + '_combined'];
      await loadLeague(activeLeague, true);
      btn.classList.remove('spinning'); btn.disabled = false;
    }

    // Auto-refresh every 45s
    setInterval(() => {
      delete cache[activeLeague];
      delete cache[activeLeague + '_combined'];
      loadLeague(activeLeague, true);
    }, 45000);

    // ── Preload live-game counts for every tab so badges are correct
    // before the user ever clicks a tab, not just for the active one ──
    async function preloadLiveCounts() {
      await Promise.all(LEAGUES.filter(l => l.id !== activeLeague).map(async l => {
        try {
          if (l.type === 'tennis') {
            const cacheKey = l.id + '_combined';
            const [atpData, wtaData] = await Promise.all([
              fetch('https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard').then(r => r.json()).catch(() => ({ events: [] })),
              fetch('https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard').then(r => r.json()).catch(() => ({ events: [] })),
            ]);
            const events = [...(atpData.events || []), ...(wtaData.events || [])];
            cache[cacheKey] = events;
            const liveCount = flattenTennisMatches(events).filter(m => m.comp.status?.type?.name === 'STATUS_IN_PROGRESS').length;
            updateLiveBadge(l.id, liveCount);
          } else {
            const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${l.sport}/${l.slug}/scoreboard`);
            const data = await r.json();
            cache[l.id] = data;
            const events = data.events || [];
            const liveCount = l.type === 'golf'
              ? events.filter(ev => (ev.competitions?.[0]?.status?.type || ev.status?.type)?.state === 'in').length
              : events.filter(e => isLive(e.status)).length;
            updateLiveBadge(l.id, liveCount);
          }
        } catch { /* leave badge unset on failure, tab click will retry via loadLeague */ }
      }));
    }

    // ── Init ──────────────────────────────────────────────────────
    buildTabs();
    loadLeague(activeLeague);
    preloadLiveCounts();
  </script>
</body>
</html>
